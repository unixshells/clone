name: Bug Report
description: Report a bug in Clone
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `clone run --kernel ... --rootfs ...`
        2. Inside the guest, run `...`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System information.
      value: |
        - Clone version:
        - Host OS/kernel:
        - CPU:
        - RAM:
        - Guest distro:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (run with `RUST_LOG=debug`).
      render: shell

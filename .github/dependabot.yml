version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-vmm:
        patterns:
          - "kvm-*"
          - "vm-memory"
          - "linux-loader"
          - "virtio-queue"
      async:
        patterns:
          - "tokio"
          - "io-uring"
      serialization:
        patterns:
          - "serde"
          - "serde_json"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

repos:
  - repo: local
    hooks:
      - id: cargo-autofix
        name: cargo autofix (fmt + fix + clippy --fix)
        entry: bash -c 'mise exec -- cargo fmt && mise exec -- cargo fix --allow-dirty --allow-staged 2>/dev/null; mise exec -- cargo clippy --fix --allow-dirty --allow-staged 2>/dev/null; mise exec -- cargo fmt'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fmt-check
        name: cargo fmt check
        entry: mise exec -- cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: mise exec -- cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete (unused deps)
        entry: bash -c 'command -v cargo-machete >/dev/null 2>&1 || cargo install --locked cargo-machete 2>/dev/null || true; mise exec -- cargo machete --skip-target-dir'
        language: system
        files: Cargo\.toml$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: mise exec -- cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: cargo deny
        entry: mise exec -- cargo deny check
        language: system
        files: Cargo\.(toml|lock)
        pass_filenames: false
        stages: [pre-push]

  # Conventional Commits enforcement on the commit message itself.
  # Mirrors the GitHub "Lint meta / Commit messages" job so local
  # commits fail before push, instead of after CI runs.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test

  # Markdown lint over docs/ and root MD files. Mirrors the
  # "Lint meta / Markdown" CI job so doc edits fail fast locally.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        files: '^(docs/.*\.md|[^/]+\.md)$'
